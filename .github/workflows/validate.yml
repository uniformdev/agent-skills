name: Validate

# Cheap, deterministic checks — no agent runs, no API keys, no cost. The expensive
# eval suite is a separate, manually dispatched workflow (skill-evals.yml).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate skills
        run: npm run validate

      - name: Typecheck skill templates
        run: npm run typecheck:templates

      - name: Check generated plugin manifests are current
        run: npm run validate:plugins

      # Deliberately not --strict. The plugin omits `version` so Claude Code falls back to
      # the git commit SHA and every merge reaches users as an update; --strict turns that
      # design choice into a hard failure. Errors still fail the step.
      - name: Validate plugin manifests
        run: npx --yes @anthropic-ai/claude-code plugin validate .
